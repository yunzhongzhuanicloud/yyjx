<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtTime=ms=>{if(!ms)return'-';const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtSec=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const thumbPic=url=>{if(!url||typeof url!=='string')return url;if(url.includes('param='))return url;return url+(url.includes('?')?'&':'?')+'param=130y130'};

let toastTimer=null;
function toast(msg){let el=document.getElementById('_toast');if(!el){el=document.createElement('div');el.id='_toast';el.className='ios-toast';document.body.appendChild(el)}el.textContent=msg;el.className='ios-toast show';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.className='ios-toast'},2000)}

let searchState={kw:'',type:'1',offset:0,limit:30,count:0,loading:false,hasMore:true,allItems:[]};
let viewMode='search';
let detailState={type:null,id:null};
let searchCacheHtml=''; // Cache search results HTML when navigating to detail
let playerState={list:[],curIdx:-1,mode:0,resolving:false};
let lyricState={lines:[],curLine:-1,songId:null};
let mvState={list:[],curIdx:-1,resolving:false,currentBrs:{}};
let currentPtab='list';

// ==================== PERSISTENCE ====================
const LS_KEY='_m2_state';
function saveState(){
  try{
    const s={
      playlist:playerState.list,
      curIdx:playerState.curIdx,
      mode:playerState.mode,
      quality:$('#pfQuality').value,
      mvList:mvState.list,
      mvCurIdx:mvState.curIdx,
      currentPtab:currentPtab,
    };
    localStorage.setItem(LS_KEY,JSON.stringify(s));
  }catch(e){
    console.error('MediaSession error:', e);
  }

}
function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw)return null;
    return JSON.parse(raw);
  }catch(_){return null}
}
// Restore state on load (NOT search - don't restore search to avoid blocking page)
(function restoreState(){
  const s=loadState();
  if(!s)return;
  if(s.playlist&&s.playlist.length){
    playerState.list=s.playlist;
    playerState.curIdx=s.curIdx>=0&&s.curIdx<s.playlist.length?s.curIdx:-1;
    playerState.mode=s.mode||0;
    if(playerState.curIdx>=0){
      const song=playerState.list[playerState.curIdx];
      $('#mbTitle').textContent=song.n||'(未知)';
      $('#mbArtist').textContent=song.ar||'-';
      if(song.pu)$('#mbArt').src=thumbPic(song.pu);
      showMiniBar();
    }
    if(playerState.curIdx>=0){
      const song=playerState.list[playerState.curIdx];
      $('#pfTitle').textContent=song.n||'(未知)';
      $('#pfArtist').textContent=song.ar||'-';
      if(song.pu)$('#pfArt').src=thumbPic(song.pu);
    }
  }
  if(s.mode!=null){
    playerState.mode=s.mode;
  }
  if(s.quality){
    $('#pfQuality').value=s.quality;
  }
  // Do NOT restore search keyword or type - start fresh each visit
  if(s.mvList&&s.mvList.length){
    mvState.list=s.mvList;
    mvState.curIdx=s.mvCurIdx>=0&&s.mvCurIdx<s.mvList.length?s.mvCurIdx:-1;
  }
  if(s.currentPtab){
    currentPtab=s.currentPtab;
    document.querySelectorAll('.ptab').forEach(t=>{
      t.classList.toggle('active',t.dataset.ptab===s.currentPtab);
    });
    const indicator=$('#ptabIndicator');
    if(indicator){
      if(s.currentPtab==='lyrics')indicator.classList.add('right');
      else indicator.classList.remove('right');
    }
    const panels=$('#pcPanels');
    if(panels){
      if(s.currentPtab==='lyrics')panels.classList.add('show-lyrics');
      else panels.classList.remove('show-lyrics');
    }
  }
})();

const QUALITY_LABEL={'128000':'128k','192000':'192k','320000':'320k','3200000':'FLAC'};
const QUALITY_ORDER=['3200000','320000','192000','128000'];
const MODE_LABELS=['顺序播放','单曲循环','随机播放'];
const MV_QUALITY_LABEL={'240':'240P','480':'480P','720':'720P','1080':'1080P'};

document.querySelectorAll('.type-pill').forEach(p=>p.onclick=()=>{
  document.querySelectorAll('.type-pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active');
  searchState.type=p.dataset.type;
  saveState();
  if(searchState.kw)doSearch();
});

$('#kw').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
$('#kw').addEventListener('input',()=>{
  const hasText=$('#kw').value.trim().length>0;
  $('#searchClear').classList.toggle('show',hasText);
  $('#searchGo').classList.toggle('show',hasText);
});
$('#searchClear').onclick=()=>{
  $('#kw').value='';
  $('#searchClear').classList.remove('show');
  $('#searchGo').classList.remove('show');
  $('#kw').focus();
};
$('#searchGo').onclick=()=>doSearch();

async function doSearch(){
  const kw=$('#kw').value.trim();
  if(!kw)return;
  searchState.kw=kw;
  searchState.offset=0;
  searchState.allItems=[];
  searchState.hasMore=true;
  searchState.loading=false;
  viewMode='search';
  $('#navTitle').textContent='搜索';
  $('#navBack').style.display='none';
  saveState();
  renderSearch(true);
}

async function renderSearch(isNew){
  const c=$('#content');
  if(isNew){
    // Show skeleton cards while loading
    let skel='';
    for(let i=0;i<8;i++){
      skel+=`<div class="skel-row">
        <div class="skel-art"></div>
        <div class="skel-text">
          <div class="skel-title"></div>
          <div class="skel-sub"></div>
        </div>
        <div class="skel-btn"></div>
      </div>`;
    }
    c.innerHTML='<div class="skeleton-list">'+skel+'</div>';
    searchState.allItems=[];
  }
  if(searchState.loading||!searchState.hasMore)return;
  searchState.loading=true;
  try{
    const resp=await fetch('/api/search',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({keyword:searchState.kw,type:searchState.type,offset:searchState.offset,limit:searchState.limit})});
    const data=await resp.json();
    if(!data.ok){c.innerHTML='<div class="ios-alert">搜索失败，请稍后重试</div>';searchState.loading=false;return}
    searchState.count=data.cnt||0;
    let items,renderFn;
    if(searchState.type==='100'){items=data.artists||[];renderFn=renderArtistRow}
    else if(searchState.type==='10'){items=data.albums||[];renderFn=renderAlbumRow}
    else if(searchState.type==='1000'){items=data.playlists||[];renderFn=renderPlaylistRow}
    else if(searchState.type==='1004'){items=data.mvs||[];renderFn=renderMvRow}
    else{items=data.list||[];renderFn=renderSongRow}
    searchState.allItems=searchState.allItems.concat(items);
    searchState.hasMore=searchState.offset+searchState.limit<searchState.count;
    let h='';
    if(!searchState.allItems.length){h='<div class="empty-state"><div class="empty-state-text">未找到相关结果</div></div>'}
    else{
      h=searchState.allItems.map((s,i)=>renderFn(s,i)).join('');
      if(searchState.hasMore)h+='<div class="load-more" id="loadMore"><div class="load-more-spinner"></div>加载更多...</div>';
    }
    c.innerHTML=h;
    c.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>handleAct(b));
    c.querySelectorAll('[data-row-act]').forEach(row=>row.onclick=e=>{
      if(e.target.closest('.song-actions'))return;
      openDetail(row.dataset.rowAct,row.dataset.id);
    });
    setupInfiniteScroll();
  }catch(e){c.innerHTML='<div class="ios-alert">请求失败</div>'}
  finally{searchState.loading=false}
}

function setupInfiniteScroll(){
  const sentinel=$('#loadMore');
  if(!sentinel)return;
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting&&!searchState.loading&&searchState.hasMore){
        searchState.offset+=searchState.limit;
        renderSearch(false);
      }
    });
  },{root:$('#content'),rootMargin:'0px',threshold:0.1});
  observer.observe(sentinel);
}

function renderSongRow(s,i){
  const id=s.id,name=s.n||'(未知)',ar=s.ar||'',al=s.al||'',pic=s.pu||'',dt=s.dt?fmtTime(s.dt):'';
  let badges='';
  if(s.sq)badges+='<span class="song-badge badge-sq">SQ</span>';
  if(s.hr)badges+='<span class="song-badge badge-sq">Hi-Res</span>';
  if(s.fee===1)badges+='<span class="song-badge badge-vip">VIP</span>';
  return `<div class="song-row">
    <img class="song-art" src="${esc(thumbPic(pic))}" onerror="this.style.visibility='hidden'">
    <div class="song-text">
      <div class="song-title">${esc(name)}${badges}</div>
      <div class="song-subtitle">${esc(ar)}${al?' · '+esc(al):''}${dt?' · '+dt:''}</div>
    </div>
    <div class="song-actions">
      <button class="ios-btn" data-act="play" data-id="${esc(id)}" data-name="${esc(name)}" data-ar="${esc(ar)}" data-pic="${esc(pic)}" data-dt="${esc(s.dt||'')}">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ios-btn add" data-act="add" data-id="${esc(id)}" data-name="${esc(name)}" data-ar="${esc(ar)}" data-pic="${esc(pic)}" data-dt="${esc(s.dt||'')}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>`;
}

function renderArtistRow(a,i){
  const id=a.id,name=a.n||'(未知)',pic=a.pu||'';
  const ms=a.musicSize!=null?a.musicSize+' 单曲':'';
  return `<div class="song-row" data-row-act="artist" data-id="${esc(id)}">
    <img class="song-art" src="${esc(thumbPic(pic))}" onerror="this.style.visibility='hidden'" style="border-radius:50%">
    <div class="song-text">
      <div class="song-title">${esc(name)}</div>
      <div class="song-subtitle">${esc(ms)}</div>
    </div>
    <div class="song-actions">
      <button class="ios-btn" data-act="artist" data-id="${esc(id)}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>`;
}

function renderAlbumRow(al,i){
  const id=al.id,name=al.n||'(未知)',pic=al.pu||'',ar=al.ar||'',size=al.size!=null?al.size+' 首':'';
  return `<div class="song-row" data-row-act="album" data-id="${esc(id)}">
    <img class="song-art" src="${esc(thumbPic(pic))}" onerror="this.style.visibility='hidden'">
    <div class="song-text">
      <div class="song-title">${esc(name)}</div>
      <div class="song-subtitle">${esc(ar)}${size?' · '+esc(size):''}</div>
    </div>
    <div class="song-actions">
      <button class="ios-btn" data-act="album" data-id="${esc(id)}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>`;
}

function renderPlaylistRow(p,i){
  const id=p.id,name=p.n||'(未知)',pic=p.pu||'',by=p.by||'',count=p.count!=null?p.count+' 首':'';
  return `<div class="song-row" data-row-act="playlist" data-id="${esc(id)}">
    <img class="song-art" src="${esc(thumbPic(pic))}" onerror="this.style.visibility='hidden'">
    <div class="song-text">
      <div class="song-title">${esc(name)}</div>
      <div class="song-subtitle">${esc(by)}${count?' · '+esc(count):''}</div>
    </div>
    <div class="song-actions">
      <button class="ios-btn" data-act="playlist" data-id="${esc(id)}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>`;
}

function renderMvRow(m,i){
  const id=m.id,name=m.n||'(未知)',pic=m.pu||'',ar=m.ar||'',dt=m.dt?fmtTime(m.dt):'';
  return `<div class="song-row">
    <img class="song-art" src="${esc(thumbPic(pic))}" onerror="this.style.visibility='hidden'">
    <div class="song-text">
      <div class="song-title">${esc(name)}</div>
      <div class="song-subtitle">${esc(ar)}${dt?' · '+dt:''}</div>
    </div>
    <div class="song-actions">
      <button class="ios-btn" data-act="mvplay" data-id="${esc(id)}" data-name="${esc(name)}" data-ar="${esc(ar)}" data-pic="${esc(pic)}" data-dt="${esc(m.dt||'')}">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ios-btn add" data-act="mvadd" data-id="${esc(id)}" data-name="${esc(name)}" data-ar="${esc(ar)}" data-pic="${esc(pic)}" data-dt="${esc(m.dt||'')}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>`;
}

function handleAct(b){
  const act=b.dataset.act;
  if(act==='play')playNow({id:b.dataset.id,n:b.dataset.name,ar:b.dataset.ar,pu:b.dataset.pic,dt:b.dataset.dt?parseInt(b.dataset.dt):0});
  else if(act==='add'){addToList({id:b.dataset.id,n:b.dataset.name,ar:b.dataset.ar,pu:b.dataset.pic,dt:b.dataset.dt?parseInt(b.dataset.dt):0});toast('已加入播放列表')}
  else if(act==='artist')openDetail('artist',b.dataset.id);
  else if(act==='album')openDetail('album',b.dataset.id);
  else if(act==='playlist')openDetail('playlist',b.dataset.id);
  else if(act==='mvplay')mvPlayNow({id:b.dataset.id,n:b.dataset.name,ar:b.dataset.ar,cover:b.dataset.pic,duration:b.dataset.dt?parseInt(b.dataset.dt):0});
  else if(act==='mvadd'){mvAddToList({id:b.dataset.id,n:b.dataset.name,ar:b.dataset.ar,cover:b.dataset.pic,duration:b.dataset.dt?parseInt(b.dataset.dt):0});toast('已加入MV列表')}
}

async function openDetail(type,id){
  detailState={type,id};
  viewMode=type;
  $('#navTitle').textContent=type==='artist'?'歌手':type==='album'?'专辑':'歌单';
  $('#navBack').style.display='';
  // Cache current search results before replacing with detail
  searchCacheHtml=$('#content').innerHTML;
  const c=$('#content');
  // Show detail skeleton loading
  let skel='<div class="skel-detail">';

// ==================== MUSIC PLAYER ====================
const audio=$('#audio');

let mediaSessionTitle='';
let mediaSessionArtist='';
let mediaSessionArtUrl='';

function updateMediaSession(title,artist,artUrl){
  mediaSessionTitle=title||'';
  mediaSessionArtist=artist||'';
  mediaSessionArtUrl=artUrl||'';
  try{
    if(!('mediaSession' in navigator))return;
    const artwork=[];
    if(artUrl){
      // Provide multiple sizes for iOS
      const fullUrl=artUrl.replace(/\?param=\d+y\d+/,'');
      artwork.push({src:fullUrl,sizes:'96x96',type:'image/jpeg'});
      artwork.push({src:fullUrl,sizes:'128x128',type:'image/jpeg'});
      artwork.push({src:fullUrl,sizes:'192x192',type:'image/jpeg'});
      artwork.push({src:fullUrl,sizes:'256x256',type:'image/jpeg'});
      artwork.push({src:fullUrl,sizes:'384x384',type:'image/jpeg'});
      artwork.push({src:fullUrl,sizes:'512x512',type:'image/jpeg'});
    }
    navigator.mediaSession.metadata=new MediaMetadata({
      title:mediaSessionTitle,
      artist:mediaSessionArtist,
      album:mediaSessionArtist,
      artwork:artwork
    });
  }catch(_){}
}

function updateMediaSessionLyrics(){
  try{
    if(!('mediaSession' in navigator))return;
    if(!navigator.mediaSession.metadata)return;
    // iOS doesn't have a direct lyrics API, but we can update the metadata
    // to include the current lyric line in the title field
    const curLyric=lyricState.curLine>=0&&lyricState.lines[lyricState.curLine]?lyricState.lines[lyricState.curLine].text:'';
    if(curLyric){
      navigator.mediaSession.metadata=new MediaMetadata({
        title:mediaSessionTitle,
        artist:curLyric,
        album:mediaSessionArtist,
        artwork:navigator.mediaSession.metadata.artwork||[]
      });
    }else{
      navigator.mediaSession.metadata=new MediaMetadata({
        title:mediaSessionTitle,
        artist:mediaSessionArtist,
        album:mediaSessionArtist,
        artwork:navigator.mediaSession.metadata.artwork||[]
      });
    }
  }catch(_){}
}

// Set up media session action handlers
try{
  if('mediaSession' in navigator){
    navigator.mediaSession.setActionHandler('play',()=>{audio.play()});
    navigator.mediaSession.setActionHandler('pause',()=>{audio.pause()});
    navigator.mediaSession.setActionHandler('nexttrack',()=>next(false));
    navigator.mediaSession.setActionHandler('previoustrack',()=>prev());
  }
}catch(e){
  console.error('MediaSession handler error:', e);
}

function playNow(song){
  const exist=playerState.list.findIndex(s=>s.id===song.id);
  if(exist>=0){playByIndex(exist);return}
  playerState.list.push(song);
  playerState.curIdx=playerState.list.length-1;
  resolveAndPlay(song);
  showMiniBar();
  showPlayer();
  saveState();
}

function addToList(song){
  if(!playerState.list.some(s=>s.id===song.id))playerState.list.push(song);
  // If mini bar is hidden (first song added), show it with pending song info
  if($('#miniBar').classList.contains('hidden')){
    if(playerState.curIdx<0){
      // No song currently playing, show the newly added song as pending
      const lastSong=playerState.list[playerState.list.length-1];
      $('#mbTitle').textContent=lastSong.n||'(未知)';
      $('#mbArtist').textContent=lastSong.ar||'-';
      if(lastSong.pu)$('#mbArt').src=thumbPic(lastSong.pu);
    }
    showMiniBar();
  }
  saveState();
}
function addAllToList(songs){for(const s of songs){if(s&&s.id&&!playerState.list.some(x=>x.id===s.id))playerState.list.push(s)}saveState()}
function playAll(songs){playerState.list=songs.filter(s=>s&&s.id).slice();playerState.curIdx=-1;if(playerState.list.length)playByIndex(0);showMiniBar();showPlayer();saveState()}

function playByIndex(idx){
  if(idx<0||idx>=playerState.list.length)return;
  playerState.curIdx=idx;
  resolveAndPlay(playerState.list[idx]);
  showMiniBar();
  saveState();
}

function showPlayerLoading(){
  $('#pfArt').classList.add('loading');
  $('#pfArtSkel').classList.add('show');
  $('#pfTitle').classList.add('loading');
  $('#pfTitleSkel').classList.add('show');
  $('#pfArtist').classList.add('loading');
  $('#pfArtistSkel').classList.add('show');
}
function hidePlayerLoading(){
  $('#pfArt').classList.remove('loading');
  $('#pfArtSkel').classList.remove('show');
  $('#pfTitle').classList.remove('loading');
  $('#pfTitleSkel').classList.remove('show');

async function resolveAndPlay(song){
  if(playerState.resolving)return;
  playerState.resolving=true;
  showPlayerLoading();
  $('#mbTitle').textContent=(song.n||'')+' — 解析中…';
  try{
    const br=$('#pfQuality').value;
    const resp=await fetch('/api/resolve',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({input:song.id})});
    const data=await resp.json();
    if(!data.ok||!data.ds){hidePlayerLoading();$('#pfTitle').textContent=song.n||'(未知)';$('#pfArtist').textContent='解析失败';$('#mbTitle').textContent=song.n||'(未知)';$('#mbArtist').textContent='解析失败';return}
    const okDs=data.ds.filter(x=>x.ok&&x.d&&x.d.u);
    if(!okDs.length){hidePlayerLoading();$('#pfTitle').textContent=song.n||'(未知)';$('#pfArtist').textContent='无可用音源';return}
    const availBrs=okDs.map(x=>x.br).sort((a,b)=>QUALITY_ORDER.indexOf(a)-QUALITY_ORDER.indexOf(b));
    $('#pfQuality').innerHTML=availBrs.map(b=>'<option value="'+b+'">'+(QUALITY_LABEL[b]||b)+'</option>').join('');
    let chosen=okDs.find(x=>x.br===br);
    if(!chosen){for(const b of[...QUALITY_ORDER].reverse()){chosen=okDs.find(x=>x.br===b);if(chosen)break}}
    $('#pfQuality').value=chosen.br;
    saveState();
    const url=String(chosen.d.u).replace(/^http:\/\//i,'https://');
    const info=data.info||{};
    const dispName=info.n||song.n||'(未知)';
    const dispArtist=info.ar||song.ar||'-';
    const dispPic=info.pu||song.pu||'';
    hidePlayerLoading();
    $('#pfTitle').textContent=dispName;
    $('#pfArtist').textContent=dispArtist;
    if(dispPic)$('#pfArt').src=thumbPic(dispPic);
    $('#mbTitle').textContent=dispName;
    $('#mbArtist').textContent=dispArtist;
    if(dispPic)$('#mbArt').src=thumbPic(dispPic);
    audio.src=url;
    await audio.play();
    updatePlayIcon(true);
    updateMediaSession(dispName,dispArtist,dispPic);
    loadLyrics(song.id);
  }catch(e){hidePlayerLoading();$('#pfTitle').textContent=song.n||'(未知)';$('#pfArtist').textContent='播放失败';$('#mbTitle').textContent=song.n||'(未知)';$('#mbArtist').textContent='播放失败'}
  finally{playerState.resolving=false}
}

function removeAt(idx){
  playerState.list.splice(idx,1);
  if(idx===playerState.curIdx){playerState.curIdx=-1;audio.pause();audio.src='';updatePlayIcon(false);$('#pfTitle').textContent='未播放';$('#pfArtist').textContent='-';hideMiniBar()}
  else if(idx<playerState.curIdx)playerState.curIdx--;
  renderPlayerContent();
  saveState();
}

function next(auto){
  if(!playerState.list.length)return;
  if(playerState.mode===1){playByIndex(playerState.curIdx);return}
  if(playerState.mode===2){if(playerState.list.length===1){playByIndex(0);return}let r;do{r=Math.floor(Math.random()*playerState.list.length)}while(r===playerState.curIdx);playByIndex(r);return}
  let n=playerState.curIdx+1;
  if(n>=playerState.list.length){if(auto){updatePlayIcon(false);return}n=0}
  playByIndex(n);
}

function prev(){if(!playerState.list.length)return;let p=playerState.curIdx-1;if(p<0)p=playerState.list.length-1;playByIndex(p)}

function togglePlay(){if(!audio.src){if(playerState.list.length)playByIndex(playerState.curIdx>=0?playerState.curIdx:0);return}if(audio.paused)audio.play();else audio.pause()}

function updatePlayIcon(playing){
  const playSvg='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const pauseSvg='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
  $('#pfPlay').innerHTML=playing?pauseSvg:playSvg;
  $('#mbPlay').innerHTML=playing?pauseSvg:playSvg;
}

function showMiniBar(){$('#miniBar').classList.remove('hidden')}
function hideMiniBar(){$('#miniBar').classList.add('hidden')}

$('#mbPlay').onclick=e=>{e.stopPropagation();togglePlay()};
$('#mbNext').onclick=e=>{e.stopPropagation();next(false)};

// ==================== GESTURE: swipe down to close player, swipe up from miniBar to open ====================
let pfGestureActive=false;
let pfGestureStartY=0;
let pfGestureMode=null; // 'close' (swipe down on open player) or 'open' (swipe up from miniBar)
let pfGestureLastY=0;

function pfGestureStart(e){
  const touch=e.touches?e.touches[0]:e;
  pfGestureStartY=touch.clientY;
  pfGestureLastY=touch.clientY;
  pfGestureActive=true;
  pfGestureMode=null;
  // Determine mode based on where the gesture started
  const pf=$('#playerFull');
  if(pf.classList.contains('show')){
    pfGestureMode='close';
  }else if(!$('#miniBar').classList.contains('hidden')){
    pfGestureMode='open';
  }else{
    pfGestureActive=false;
    return;
  }
  // Disable transition during drag
  pf.style.transition='none';
}

function pfGestureMove(e){
  if(!pfGestureActive)return;
  const touch=e.touches?e.touches[0]:e;
  const dy=touch.clientY-pfGestureStartY;
  pfGestureLastY=touch.clientY;
  const pf=$('#playerFull');
  const winH=window.innerHeight;

  if(pfGestureMode==='close'){
    // Player is open, user swipes down to close
    // Only allow downward drag (dy > 0), clamp at 0
    const offset=Math.max(0,dy);
    pf.style.transform='translateY('+offset+'px)';
    e.preventDefault();
  }else if(pfGestureMode==='open'){
    // Player is hidden (translateY(100%)), user swipes up from miniBar
    // Only allow upward drag (dy < 0), clamp at 0
    const offset=Math.min(0,dy); // negative = moving up
    // Position the player's top edge at the finger's absolute screen Y position.
    // The player has inset:0 (natural top = 0), so translateY(touch.clientY)
    // puts the player's top exactly at the finger's Y coordinate.
    // Clamp so the player's top never goes above 0 (fully open) and never
    // goes below winH (fully hidden).
    const newOffset=Math.max(0,Math.min(winH,touch.clientY));
    pf.style.transform='translateY('+newOffset+'px)';
    // Also show the player during drag if not already visible
    if(!pf.classList.contains('show')&&offset<-10){
      pf.classList.add('show');
      renderPlayerContent();
    }
    e.preventDefault();
  }
}

function pfGestureEnd(e){
  if(!pfGestureActive)return;
  pfGestureActive=false;
  const touch=e.changedTouches?e.changedTouches[0]:e;
  const dy=touch.clientY-pfGestureStartY;
  const pf=$('#playerFull');
  // Re-enable transition for snap animation
  pf.style.transition='';
  pf.style.transform='';

  if(pfGestureMode==='close'){
    if(dy>80){
      // User dragged down enough → close
      pf.classList.remove('show');
    }
    // Otherwise snap back to open (transform already cleared, .show still present)
  }else if(pfGestureMode==='open'){
    if(dy<-80){
      // User dragged up enough → open fully
      pf.classList.add('show');
      renderPlayerContent();
    }else{
      // User didn't drag far enough (or changed direction) → close back
      pf.classList.remove('show');
    }
  }
  pfGestureMode=null;
}

// ==================== LYRICS ====================
async function loadLyrics(id){
  lyricState={lines:[],curLine:-1,songId:id};
  if(!id)return;
  try{
    const resp=await fetch('/api/lyric',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id})});
    const data=await resp.json();
    if(!data.ok||!data.lrc){lyricState.lines=[];renderPlayerContent();return}
    lyricState.lines=parseLrc(data.lrc);
    renderPlayerContent();
  }catch(_){lyricState.lines=[];renderPlayerContent()}
}

function parseLrc(lrcStr){
  if(!lrcStr)return[];
  const result=[];
  const re=/\[(\d+):(\d+(?:\.\d+)?)\]/g;
  lrcStr.split('\n').forEach(line=>{
    const matches=[];let m;
    while((m=re.exec(line))!==null)matches.push(parseInt(m[1])*60+parseFloat(m[2]));
    const text=line.replace(re,'').trim();
    if(matches.length&&text)matches.forEach(t=>result.push({t,text}));
  });
  result.sort((a,b)=>a.t-b.t);
  return result;
}

function renderLyricsView(el){
  if(!lyricState.lines.length){
    el.innerHTML='<div class="lyric-empty">暂无歌词</div>';
    return;
  }
  let h='<div class="lyrics-container">';
  h+=lyricState.lines.map((l,i)=>{
    const diff=i-lyricState.curLine;
    let cls='lyric-line';
    if(diff===0)cls+=' cur';
    else if(Math.abs(diff)<=2)cls+=' near';
    return `<div class="${cls}" data-lidx="${i}">${esc(l.text)}</div>`;
  }).join('');
  h+='</div>';
  el.innerHTML=h;
  el.querySelectorAll('[data-lidx]').forEach(ln=>ln.onclick=()=>{
    const idx=+ln.dataset.lidx;
    if(lyricState.lines[idx]&&audio.duration){
      audio.currentTime=Math.max(0,Math.min(audio.duration,lyricState.lines[idx].t));
    }
  });
}

function updateLyricsView(){
  if(currentPtab!=='lyrics')return;
  const el=$('#pcLyrics');
  const lines=el.querySelectorAll('.lyric-line');
  if(!lines.length)return;
  lines.forEach(ln=>{
    const idx=+ln.dataset.lidx;
    const diff=idx-lyricState.curLine;
    ln.className='lyric-line';
    if(diff===0)ln.classList.add('cur');
    else if(Math.abs(diff)<=2)ln.classList.add('near');
  });
  const cur=el.querySelector('.lyric-line.cur');
  if(cur)cur.scrollIntoView({behavior:'smooth',block:'center'});
}

// ==================== MV PLAYER ====================
const mvVideo=$('#mvVideo');

function mvPlayNow(mv){
  const exist=mvState.list.findIndex(x=>x.id===mv.id);
  if(exist>=0){mvPlayByIndex(exist);return}
  mvState.list.push(mv);
  mvState.curIdx=mvState.list.length-1;
  mvResolveAndPlay(mv);
  showMvPlayer();
  saveState();
}

function mvAddToList(mv){if(!mvState.list.some(x=>x.id===mv.id))mvState.list.push(mv);saveState()}

function mvPlayByIndex(idx){
  if(idx<0||idx>=mvState.list.length)return;
  mvState.curIdx=idx;
  mvResolveAndPlay(mvState.list[idx]);
  showMvPlayer();
  saveState();
}

async function mvResolveAndPlay(mv){
  if(mvState.resolving)return;
  mvState.resolving=true;
  $('#mvTitle').textContent=(mv.n||'')+' — 解析中…';
  try{
    const resp=await fetch('/api/mv',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:mv.id})});
    const data=await resp.json();
    if(!data.ok||!data.brs){$('#mvTitle').textContent=mv.n||'(未知)';$('#mvArtist').textContent='解析失败';return}
    mvState.currentBrs=data.brs;
    const mvInfo=data.mv||{};
    mv.n=mvInfo.n||mv.n;mv.ar=mvInfo.ar||mv.ar;mv.cover=mvInfo.cover||mv.cover;mv.duration=mvInfo.duration||mv.duration;
    const keys=Object.keys(data.brs).sort((a,b)=>parseInt(b)-parseInt(a));
    $('#mvQuality').innerHTML=keys.map(k=>'<option value="'+k+'">'+(MV_QUALITY_LABEL[k]||k+'P')+'</option>').join('');
    let pref=null;
    try{pref=localStorage.getItem('_mv_quality')}catch(_){}
    if(pref&&keys.includes(pref))$('#mvQuality').value=pref;
    else $('#mvQuality').value=keys[keys.length-1];
    const best=$('#mvQuality').value||keys[0];
    const url=String(data.brs[best]||data.brs[keys[0]]).replace(/^http:\/\//i,'https://');
    $('#mvTitle').textContent=mv.n||'(未知)';
    $('#mvArtist').textContent=mv.ar||'-';
    mvVideo.src=url;
    mvVideo.play();
    audio.pause();
    updateMediaSession(mv.n||'(未知)',mv.ar||'-',mv.cover||'');
    // Set playback state for MV
    try{if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing'}catch(_){}
  }catch(e){$('#mvTitle').textContent=mv.n||'(未知)';$('#mvArtist').textContent='解析失败'}
  finally{mvState.resolving=false}
}

function showMvPlayer(){
  $('#mvOverlay').classList.add('show');
  renderMvList();
}

function renderMvList(){
  const el=$('#mvList');
  if(!mvState.list.length){el.innerHTML='<div class="empty-state"><div class="empty-state-text">MV列表为空</div></div>';return}
  el.innerHTML=mvState.list.map((m,i)=>{
    const playing=i===mvState.curIdx;
    return `<div class="mv-list-item${playing?' playing':''}" data-idx="${i}">
      <div class="mv-li-num">${playing?'▶':(i+1)}</div>
      <img class="mv-li-art" src="${esc(thumbPic(m.cover||''))}" onerror="this.style.visibility='hidden'">
      <div style="flex:1;min-width:0">
        <div class="mv-li-title">${esc(m.n||'(未知)')}</div>
        <div class="mv-li-sub">${esc(m.ar||'')}</div>
      </div>
      <button class="mv-li-del" data-del="${i}">✕</button>
    </div>`;
  }).join('');
  el.querySelectorAll('.mv-list-item').forEach(item=>item.onclick=e=>{if(e.target.closest('[data-del]'))return;mvPlayByIndex(+item.dataset.idx)});
  el.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();mvState.list.splice(+b.dataset.del,1);if(+b.dataset.del===mvState.curIdx){mvState.curIdx=-1;mvVideo.pause();mvVideo.src='';$('#mvTitle').textContent='未播放';$('#mvArtist').textContent='-'}renderMvList();saveState()});
}

function mvNext(){
  if(!mvState.list.length)return;
  let n=mvState.curIdx+1;
  if(n>=mvState.list.length)n=0;
  mvPlayByIndex(n);
}

function mvPrev(){
  if(!mvState.list.length)return;
  let p=mvState.curIdx-1;
  if(p<0)p=mvState.list.length-1;
  mvPlayByIndex(p);
}

$('#mvClose').onclick=()=>{$('#mvOverlay').classList.remove('show');mvVideo.pause()};
$('#mvPlay').onclick=()=>{if(mvVideo.paused)mvVideo.play();else mvVideo.pause()};
$('#mvNext').onclick=mvNext;
$('#mvPrev').onclick=mvPrev;
$('#mvQuality').onchange=()=>{
  try{localStorage.setItem('_mv_quality',$('#mvQuality').value)}catch(_){}
  if(mvState.currentBrs&&$('#mvQuality').value){
    const url=String(mvState.currentBrs[$('#mvQuality').value]).replace(/^http:\/\//i,'https://');
    const t=mvVideo.currentTime;
    const wasPlaying=!mvVideo.paused;
    mvVideo.src=url;
    mvVideo.addEventListener('loadedmetadata',()=>{mvVideo.currentTime=t;if(wasPlaying)mvVideo.play()},{once:true});
  }
};

// MV video event listeners
mvVideo.addEventListener('play',()=>{audio.pause();updateMvPlayIcon(true)});
